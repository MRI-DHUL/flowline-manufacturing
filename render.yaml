services:
  - type: web
    name: flowline-manufacturing-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run typecheck && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_ENABLED
        value: false
      - key: LOG_LEVEL
        value: info
  - type: web
    name: flowline-manufacturing-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run lint && npm test && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://flowline-manufacturing-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html