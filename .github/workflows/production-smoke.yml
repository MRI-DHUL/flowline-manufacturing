name: Production Smoke

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Verify production
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve latest tested commit
        shell: bash
        run: |
          expected_commit="$(curl --fail --silent --show-error --max-time 30 \
            https://api.github.com/repos/MRI-DHUL/flowline-manufacturing/commits/main \
            | sed -n 's/.*"sha": "\([a-f0-9]\{40\}\)".*/\1/p' \
            | head -n 1)"
          test -n "$expected_commit"
          echo "EXPECTED_COMMIT=$expected_commit" >> "$GITHUB_ENV"
      - name: Wait for backend health
        shell: bash
        run: |
          for attempt in {1..30}; do
            response="$(curl --fail --silent --show-error --max-time 20 \
              https://flowline-manufacturing-api.onrender.com/health || true)"
            if echo "$response" | grep --quiet '"status":"ok"'; then
              if echo "$response" | grep --quiet "\"commit\":\"$EXPECTED_COMMIT\""; then
                exit 0
              fi
            fi
            sleep 20
          done
          echo "Production did not reach the expected commit: $EXPECTED_COMMIT" >&2
          exit 1
      - name: Verify database health
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://flowline-manufacturing-api.onrender.com/api/v1/health/database \
            | grep --quiet '"schemaReady":true'
      - name: Verify frontend and SPA routes
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://flowline-manufacturing-ui.onrender.com/login \
            | grep --quiet '<div id="root">'
          curl --fail --silent --show-error --max-time 30 \
            https://flowline-manufacturing-ui.onrender.com/dashboard/order-monitor \
            | grep --quiet '<div id="root">'