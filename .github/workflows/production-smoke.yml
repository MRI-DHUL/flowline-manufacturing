name: Production Smoke

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Verify production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for backend health
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in {1..30}; do
            response="$(curl --fail --silent --show-error --max-time 20 \
              https://flowline-manufacturing-api.onrender.com/health || true)"
            if echo "$response" | grep --quiet '"status":"ok"'; then
              if [ -z "$EXPECTED_COMMIT" ] || echo "$response" | grep --quiet "\"commit\":\"$EXPECTED_COMMIT\""; then
                exit 0
              fi
            fi
            sleep 20
          done
          echo "Production did not reach the expected commit: $EXPECTED_COMMIT" >&2
          exit 1
      - name: Verify database health
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://flowline-manufacturing-api.onrender.com/api/v1/health/database \
            | grep --quiet '"schemaReady":true'
      - name: Verify frontend and SPA routes
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://flowline-manufacturing-ui.onrender.com/login \
            | grep --quiet '<div id="root">'
          curl --fail --silent --show-error --max-time 30 \
            https://flowline-manufacturing-ui.onrender.com/dashboard/order-monitor \
            | grep --quiet '<div id="root">'